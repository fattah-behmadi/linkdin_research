# Elasticsearch only - the API and the frontend run natively.
# `name` is explicit because the repository directory name is not ASCII.
name: linkedin-search

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: linkedin-search-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      # Override with ELASTICSEARCH_HOST_PORT when 9200 is taken or reserved
      # (Windows/Hyper-V excludes some ranges - see the README).
      - "${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  elasticsearch-data:
